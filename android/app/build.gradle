plugins { id 'com.android.application' }

android {
    namespace 'ru.brigade2.atlas'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'ru.brigade2.atlas'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            def signingFile = System.getenv('BRIGADE_KEYSTORE')
            if (signingFile) {
                storeFile file(signingFile)
                storePassword System.getenv('BRIGADE_STORE_PASSWORD')
                keyAlias 'brigade2'
                keyPassword System.getenv('BRIGADE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
